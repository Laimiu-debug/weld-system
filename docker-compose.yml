# 密钥从项目根目录 .env 注入（复制 .env.example）。
# 生产环境不要把 PostgreSQL / Redis / 后端 API 端口暴露到公网。

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: weld_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weld_db}
      POSTGRES_USER: ${POSTGRES_USER:-weld_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - weld_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weld_user} -d ${POSTGRES_DB:-weld_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: weld_redis
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    networks:
      - weld_network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weld_backend
    restart: always
    environment:
      TZ: Asia/Shanghai
      DEVELOPMENT: "false"
      DEBUG: "false"
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_HOST: redis
      DATABASE_HOST: postgres
    env_file:
      - ./backend/.env.production
    volumes:
      - backend_uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - weld_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端 - 用户门户
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://api.sdhaohan.cn/api/v1
    container_name: weld_frontend
    restart: always
    networks:
      - weld_network

  # 前端 - 管理门户
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=https://api.sdhaohan.cn/api/v1
    container_name: weld_admin
    restart: always
    networks:
      - weld_network

  # Nginx 反向代理和静态文件服务
  nginx:
    image: nginx:alpine
    container_name: weld_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/weld-templates:ro
      - ./nginx/docker-entrypoint-weld.sh:/docker-entrypoint-weld.sh:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - backend_uploads:/usr/share/nginx/html/uploads:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-weld.sh"]
    depends_on:
      - backend
      - frontend
      - admin-portal
    networks:
      - weld_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot - 自动申请和续期 SSL 证书
  certbot:
    image: certbot/certbot:latest
    container_name: weld_certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - weld_network

networks:
  weld_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
