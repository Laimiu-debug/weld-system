# ========================================
# HTTPS - 后端 API (api.sdhaohan.cn)
# ========================================
server {
    # Private files must only be served by authenticated backend endpoints.
    location ^~ /uploads/files { return 404; }
    location ^~ /uploads/private_documents { return 404; }
    location ^~ /storage/uploads/files { return 404; }
    location ^~ /storage/uploads/private_documents { return 404; }
    listen 443 ssl http2;
    server_name api.sdhaohan.cn;

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/sdhaohan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sdhaohan.cn/privkey.pem;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 图纸识别包含多次视觉调用，保持与客户端等待时间一致。
    location ~ ^/api/v1/engineering/revisions/[^/]+/parse$ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 反向代理到后端服务
    location / {
        # CORS 由后端 FastAPI 处理，Nginx 不添加 CORS 头部以避免重复

        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 上传文件访问
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 日志
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;
}
