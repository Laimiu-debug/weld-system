# ========================================
# HTTP 服务器 - 重定向到 HTTPS
# ========================================
server {
    # Private files must only be served by authenticated backend endpoints.
    location ^~ /uploads/files { return 404; }
    location ^~ /uploads/private_documents { return 404; }
    location ^~ /storage/uploads/files { return 404; }
    location ^~ /storage/uploads/private_documents { return 404; }
    listen 80;
    server_name sdhaohan.cn laimiu.sdhaohan.cn api.sdhaohan.cn lifecard.sdhaohan.cn ;
    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================================
# HTTPS - 用户门户 (sdhaohan.cn)
# ========================================
server {
    # Private files must only be served by authenticated backend endpoints.
    location ^~ /uploads/files { return 404; }
    location ^~ /uploads/private_documents { return 404; }
    location ^~ /storage/uploads/files { return 404; }
    location ^~ /storage/uploads/private_documents { return 404; }
    listen 443 ssl http2;
    server_name sdhaohan.cn;

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/sdhaohan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sdhaohan.cn/privkey.pem;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Docker DNS：变量 + resolver，避免重建 frontend/admin 后 IP 变更仍命中旧上游
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 图纸识别包含多次视觉调用，保持与客户端等待时间一致。
    location ~ ^/api/v1/engineering/revisions/[^/]+/parse$ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 反向代理到用户门户容器（镜像内静态产物，避免 named volume 残留旧资源）
    location / {
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 日志
    access_log /var/log/nginx/frontend_access.log;
    error_log /var/log/nginx/frontend_error.log;
}

