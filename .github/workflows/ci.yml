name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings sqlalchemy python-jose passlib python-multipart email-validator python-dotenv httpx starlette pytest psycopg2-binary asyncpg redis beautifulsoup4 pytz python-docx
      - name: Compile
        run: python -m compileall -q app
      - name: Unit tests
        run: python -m pytest tests/unit -q --tb=short
        env:
          DEVELOPMENT: "true"
