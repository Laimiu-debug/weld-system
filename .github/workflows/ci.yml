name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app
      - name: Unit tests
        run: python -m pytest tests/unit -q --tb=short
        env:
          DEVELOPMENT: "true"

  backend-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: weld_db
          POSTGRES_USER: weld_user
          POSTGRES_PASSWORD: ci-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weld_user -d weld_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DEVELOPMENT: "true"
      DEBUG: "false"
      DATABASE_URL: postgresql://weld_user:ci-db-password@localhost:5432/weld_db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Bootstrap empty database
        run: python -m app.scripts.bootstrap_schema
      - name: Exercise recent migrations
        run: |
          alembic downgrade add_company_invitations
          alembic upgrade head
          alembic current | grep "(head)"
      - name: Payment and attachment PostgreSQL regression
        run: python -m pytest tests/integration/test_foundation_integrity.py -q --tb=short
        env:
          RUN_LOCAL_DB_TESTS: "1"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Business interaction tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate

  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t weldsystem-backend-ci ./backend
      - name: Build frontend image
        run: >-
          docker build
          --build-arg VITE_API_BASE_URL=http://localhost:8000/api/v1
          -t weldsystem-frontend-ci ./frontend
      - name: Build admin image
        run: >-
          docker build
          -f ./admin-portal/Dockerfile.prod
          --build-arg VITE_API_BASE_URL=http://localhost:8000/api/v1
          -t weldsystem-admin-ci ./admin-portal
