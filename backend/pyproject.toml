[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "welding-system-backend"
version = "1.0.0"
description = "焊序后端API服务"
authors = [
    {name = "Developer", email = "dev@example.com"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.20",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.7",
    "redis>=5.0.0",
    "hiredis>=2.2.3",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0,<47.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "httpx>=0.25.0",
    "celery>=5.3.4",
    "python-magic>=0.4.27",
    "pillow>=10.1.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "pytz>=2023.3",
    "python-docx>=1.1.0",
    "pypdf>=6.0.0,<7.0.0",
    "pypdfium2>=4.30.0,<5.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "weasyprint>=60.1",
    "pydyf>=0.8.0,<0.11",
    "reportlab>=4.0.0",
    "beautifulsoup4>=4.12.2",
    "bleach[css]>=6.2.0",
    "requests>=2.32.0",
    "boto3>=1.34.0,<2.0.0",
    "lxml>=4.9.3",
    "werkzeug>=3.0.1",
    "structlog>=23.2.0",
    "rich>=13.6.0",
    "psutil>=5.9.6",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.9.1",
    "isort>=5.12.0",
    "mypy>=1.7.1",
    "flake8>=6.1.0",
    "pre-commit>=3.5.0",
    "types-passlib>=1.7.1",
    "flower>=2.0.1",
    "reportlab>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default]
PYTHONPATH = ["."]
WELD_ENV = "development"

[tool.hatch.envs.production]
WELD_ENV = "production"
DEVELOPMENT = "false"
DEBUG = "false"

[tool.hatch.envs.development]
WELD_ENV = "development"
DEVELOPMENT = "true"
DEBUG = "true"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
norecursedirs = ["scripts", "migrations", "legacy_tests", ".git", "venv", ".venv"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
