# 仅本地开发：仅把 Web/API 绑到本机回环地址。
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    environment:
      DEVELOPMENT: "true"
      DEBUG: "true"
      # 单企业内网部署示例：取消注释并改成企业名
      # ORG_NAME: "某某焊接有限公司"
      # BRAND_NAME: "焊序"
    ports:
      # 8000 在部分 Windows/Docker 环境下会被幽灵端口占用；本地开发改绑 8008
      - "127.0.0.1:8008:8000"

  celery-worker:
    profiles: ["operations"]
    environment:
      DEVELOPMENT: "true"
      DEBUG: "true"

  celery-beat:
    profiles: ["operations"]
    environment:
      DEVELOPMENT: "true"
      DEBUG: "true"

  # 本地默认不运行周期任务和备份，避免产生测试通知与备份文件。
  backup:
    profiles: ["operations"]

  frontend:
    build:
      args:
        # 相对路径：浏览器经前端 nginx 转发到 backend，避免本机端口/CORS 导致「网络连接失败」
        VITE_API_BASE_URL: /api/v1
        # VITE_ORG_NAME: "某某焊接有限公司"
    ports:
      - "127.0.0.1:3100:80"

  admin-portal:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:8008/api/v1
    ports:
      - "127.0.0.1:3001:80"

  # 本地开发直接访问上面的端口，不启动域名/TLS 入口。
  nginx:
    profiles: ["production"]

  certbot:
    profiles: ["production"]
