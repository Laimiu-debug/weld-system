version: '3.8'

# 仅本地开发：把数据库/缓存/API 绑到本机回环地址。
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    environment:
      DEVELOPMENT: "true"
      DEBUG: "true"
    ports:
      - "127.0.0.1:8000:8000"
