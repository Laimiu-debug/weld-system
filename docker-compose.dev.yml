# 仅本地开发：仅把 Web/API 绑到本机回环地址。
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    environment:
      DEVELOPMENT: "true"
      DEBUG: "true"
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:3100:80"

  admin-portal:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:3001:80"

  # 本地开发直接访问上面的端口，不启动域名/TLS 入口。
  nginx:
    profiles: ["production"]

  certbot:
    profiles: ["production"]
