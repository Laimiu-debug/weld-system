server {
    # Private files must only be served by authenticated backend endpoints.
    location ^~ /uploads/files { return 404; }
    location ^~ /uploads/private_documents { return 404; }
    location ^~ /storage/uploads/files { return 404; }
    location ^~ /storage/uploads/private_documents { return 404; }
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 注意：不需要API代理，前端直接请求 https://api.sdhaohan.cn
}

